# Navidrome — TrueNAS custom app (alternative to the catalog app).
# Music dataset mounted READ-ONLY; Navidrome writes only its own /data volume.
# Port 4533: LAN + Tailscale. Transport security comes from Tailscale (WireGuard).
services:
  navidrome:
    image: deluanv/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "4533:4533"
    environment:
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_ENABLETRANSCODINGCONFIG=true
      - ND_SCANSCHEDULE=1m
    volumes:
      - /mnt/tank/music:/music:ro
      - /mnt/tank/apps/navidrome/data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
