# OrpheusDL (hardened vendored fork) — TrueNAS custom app.
# Build the image on the NAS first: docker build -f docker/Dockerfile -t orpheusdl:hardened <repo-dir>
# No ports: exec-driven only (docker exec -it orpheusdl python orpheus.py).
services:
  orpheusdl:
    image: orpheusdl:hardened
    container_name: orpheusdl
    user: "1000:1000"
    command: ["sh", "-c", "mkdir -p /tmp/extensions /tmp/temp && sleep infinity"]
    read_only: true
    tmpfs:
      - /tmp
      # extensions/ and temp/ are symlinks into /tmp (baked into the image),
      # so the writable area is covered by this single tmpfs entry.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - /mnt/tank/music:/orpheus/music
      - /mnt/tank/apps/orpheusdl/config:/orpheus/config
