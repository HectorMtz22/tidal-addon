# OrpheusDL (hardened vendored fork) — TrueNAS custom app.
# Image comes from CI: built on every push to main after the hardening suite
# passes (ghcr.io/hectormtz22/tidal-addon:latest). One-time: make the package
# public (GitHub profile -> Packages -> tidal-addon -> Change visibility).
# No ports: exec-driven only (docker exec -it orpheusdl python orpheus.py).
services:
  orpheusdl:
    image: ghcr.io/hectormtz22/tidal-addon:latest
    container_name: orpheusdl
    user: "1000:1000"
    # No command override: the image ENTRYPOINT pre-creates /tmp dirs, then
    # the image CMD idles (sleep infinity). Overriding command here would
    # bypass the ENTRYPOINT chain — leave it absent.
    read_only: true
    tmpfs:
      - /tmp
      # extensions/ and temp/ are symlinks into /tmp (baked into the image),
      # so the writable area is covered by this single tmpfs entry.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - /mnt/drive/music-library:/orpheus/music
      - /mnt/drive/orpheusdl/config:/orpheus/config
